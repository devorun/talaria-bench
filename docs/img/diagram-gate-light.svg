<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" role="img" aria-label="The motion gate: a move is checked in 60 fixed simulated worlds; robot_play and robot_pose pass the pre_tool_call hook only with an approved move" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>The motion gate: a move is checked in 60 fixed simulated worlds; robot_play and robot_pose pass the pre_tool_call hook only with an approved move</title>
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker></defs>
<rect x="0" y="14" width="176" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="88.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">Hermes writes a move</text>
<text x="88.0" y="70" text-anchor="middle" font-size="12.5" fill="#57606a">keyframes, loops,</text>
<text x="88.0" y="87" text-anchor="middle" font-size="12.5" fill="#57606a">easing, speed</text>
<rect x="216" y="14" width="176" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="304.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">move_check</text>
<text x="304.0" y="70" text-anchor="middle" font-size="12.5" fill="#57606a">60 fixed simulated worlds,</text>
<text x="304.0" y="87" text-anchor="middle" font-size="12.5" fill="#57606a">tip chance with a 95%</text>
<text x="304.0" y="104" text-anchor="middle" font-size="12.5" fill="#57606a">Wilson interval, servo load</text>
<rect x="432" y="14" width="176" height="132" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="520.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a7f37">Approval key</text>
<text x="520.0" y="70" text-anchor="middle" font-size="12.5" fill="#57606a">for exactly this move,</text>
<text x="520.0" y="87" text-anchor="middle" font-size="12.5" fill="#57606a">speed and robot spec</text>
<rect x="648" y="14" width="176" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="736.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">pre_tool_call hook</text>
<text x="736.0" y="70" text-anchor="middle" font-size="12.5" fill="#57606a">robot_play and robot_pose</text>
<text x="736.0" y="87" text-anchor="middle" font-size="12.5" fill="#57606a">pass only with a</text>
<text x="736.0" y="104" text-anchor="middle" font-size="12.5" fill="#57606a">matching approval</text>
<rect x="864" y="14" width="176" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="952.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">Virtual or real robot</text>
<text x="952.0" y="70" text-anchor="middle" font-size="12.5" fill="#57606a">the firmware clamps</text>
<text x="952.0" y="87" text-anchor="middle" font-size="12.5" fill="#57606a">angles and speeds</text>
<text x="952.0" y="104" text-anchor="middle" font-size="12.5" fill="#57606a">again on its own</text>
<path d="M181 80.0 L211 80.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M397 80.0 L427 80.0" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="412.0" y="71.0" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#1a7f37">PASS</text>
<path d="M613 80.0 L643 80.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M829 80.0 L859 80.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="176" y="222" width="256" height="92" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="304.0" y="254" text-anchor="middle" font-size="15.5" font-weight="700" fill="#cf222e">BLOCKED</text>
<text x="304.0" y="278" text-anchor="middle" font-size="12.5" fill="#57606a">the reasons and suggestions</text>
<text x="304.0" y="295" text-anchor="middle" font-size="12.5" fill="#57606a">go back to Hermes, which revises</text>
<path d="M304.0 151 L304.0 217" fill="none" stroke="#cf222e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M171 268.0 L88.0 268.0 L88.0 151" fill="none" stroke="#cf222e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="5 4"/>
<rect x="648" y="222" width="392" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="844.0" y="254" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">A changed move, speed or spec</text>
<text x="844.0" y="278" text-anchor="middle" font-size="12.5" fill="#57606a">has no approval: the hook refuses it</text>
<text x="844.0" y="295" text-anchor="middle" font-size="12.5" fill="#57606a">until a new check passes</text>
<path d="M736.0 217 L736.0 151" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)" stroke-dasharray="5 4"/>
<text x="520" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">Simulation-based risk screening, not a safety guarantee. The return to home is speed-limited, not simulated.</text>
</svg>
