<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 232" width="1040" height="232" role="img" aria-label="How Talaria Bench works: robot spec and photo, MuJoCo model, randomized worlds, arena scenes, report card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>How Talaria Bench works: robot spec and photo, MuJoCo model, randomized worlds, arena scenes, report card</title>
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker></defs>
<rect x="0" y="14" width="176" height="158" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="22" cy="38" r="11" fill="#0969da"/><text x="22" y="42.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6f8fa">1</text>
<text x="88.0" y="70" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">Robot spec + photo</text>
<text x="88.0" y="94" text-anchor="middle" font-size="12.5" fill="#57606a">parts in cm and g,</text>
<text x="88.0" y="111" text-anchor="middle" font-size="12.5" fill="#57606a">hobby servo models;</text>
<text x="88.0" y="128" text-anchor="middle" font-size="12.5" fill="#57606a">photo: appearance only</text>
<rect x="216" y="14" width="176" height="158" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="238" cy="38" r="11" fill="#0969da"/><text x="238" y="42.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6f8fa">2</text>
<text x="304.0" y="70" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">MuJoCo model</text>
<text x="304.0" y="94" text-anchor="middle" font-size="12.5" fill="#57606a">soft contacts by material,</text>
<text x="304.0" y="111" text-anchor="middle" font-size="12.5" fill="#57606a">servo torque and speed,</text>
<text x="304.0" y="128" text-anchor="middle" font-size="12.5" fill="#57606a">servo free play</text>
<path d="M181 93.0 L211 93.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="432" y="14" width="176" height="158" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="454" cy="38" r="11" fill="#0969da"/><text x="454" y="42.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6f8fa">3</text>
<text x="520.0" y="70" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">Randomized worlds</text>
<text x="520.0" y="94" text-anchor="middle" font-size="12.5" fill="#57606a">friction, mass, torque,</text>
<text x="520.0" y="111" text-anchor="middle" font-size="12.5" fill="#57606a">latency, offsets, floor tilt;</text>
<text x="520.0" y="128" text-anchor="middle" font-size="12.5" fill="#57606a">30 per scene, 60 per move</text>
<path d="M397 93.0 L427 93.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="648" y="14" width="176" height="158" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="670" cy="38" r="11" fill="#0969da"/><text x="670" y="42.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6f8fa">4</text>
<text x="736.0" y="70" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">Arena scenes</text>
<text x="736.0" y="94" text-anchor="middle" font-size="12.5" fill="#57606a">flat floor, ramps, bars,</text>
<text x="736.0" y="111" text-anchor="middle" font-size="12.5" fill="#57606a">push, slippery floor,</text>
<text x="736.0" y="128" text-anchor="middle" font-size="12.5" fill="#57606a">payload, standing moves</text>
<path d="M613 93.0 L643 93.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="864" y="14" width="176" height="158" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<circle cx="886" cy="38" r="11" fill="#0969da"/><text x="886" y="42.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6f8fa">5</text>
<text x="952.0" y="70" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0969da">Report card</text>
<text x="952.0" y="94" text-anchor="middle" font-size="12.5" fill="#57606a">pass rate, median,</text>
<text x="952.0" y="111" text-anchor="middle" font-size="12.5" fill="#57606a">worst world and the reason</text>
<text x="952.0" y="128" text-anchor="middle" font-size="12.5" fill="#57606a">for each failure</text>
<path d="M829 93.0 L859 93.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="520" y="214" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">All of it is simulation, on a laptop CPU: no GPU, no CAD.</text>
</svg>
