<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" role="img" aria-label="The motion gate: a move is checked in 60 fixed simulated worlds; only an approved move passes the pre_tool_call hook to the virtual or real robot" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>The motion gate: a move is checked in 60 fixed simulated worlds; only an approved move passes the pre_tool_call hook to the virtual or real robot</title>
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker></defs>
<rect x="0" y="14" width="176" height="132" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="88.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e6edf3">Hermes writes a move</text>
<text x="88.0" y="70" text-anchor="middle" font-size="12.5" fill="#8b949e">keyframes, loops,</text>
<text x="88.0" y="87" text-anchor="middle" font-size="12.5" fill="#8b949e">easing, speed</text>
<rect x="216" y="14" width="176" height="132" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="304.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">move_check</text>
<text x="304.0" y="70" text-anchor="middle" font-size="12.5" fill="#8b949e">60 fixed simulated worlds,</text>
<text x="304.0" y="87" text-anchor="middle" font-size="12.5" fill="#8b949e">tip chance with a 95%</text>
<text x="304.0" y="104" text-anchor="middle" font-size="12.5" fill="#8b949e">Wilson interval, servo load</text>
<rect x="432" y="14" width="176" height="132" rx="12" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="520.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3fb950">Approval key</text>
<text x="520.0" y="70" text-anchor="middle" font-size="12.5" fill="#8b949e">for exactly this move,</text>
<text x="520.0" y="87" text-anchor="middle" font-size="12.5" fill="#8b949e">speed and robot spec</text>
<rect x="648" y="14" width="176" height="132" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="736.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">pre_tool_call hook</text>
<text x="736.0" y="70" text-anchor="middle" font-size="12.5" fill="#8b949e">robot_play and robot_pose</text>
<text x="736.0" y="87" text-anchor="middle" font-size="12.5" fill="#8b949e">pass only with a</text>
<text x="736.0" y="104" text-anchor="middle" font-size="12.5" fill="#8b949e">matching approval</text>
<rect x="864" y="14" width="176" height="132" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="952.0" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e6edf3">Virtual or real robot</text>
<text x="952.0" y="70" text-anchor="middle" font-size="12.5" fill="#8b949e">the firmware clamps</text>
<text x="952.0" y="87" text-anchor="middle" font-size="12.5" fill="#8b949e">angles and speeds</text>
<text x="952.0" y="104" text-anchor="middle" font-size="12.5" fill="#8b949e">again on its own</text>
<path d="M181 80.0 L211 80.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M397 80.0 L427 80.0" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="412.0" y="71.0" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#3fb950">PASS</text>
<path d="M613 80.0 L643 80.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M829 80.0 L859 80.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="176" y="222" width="256" height="92" rx="12" fill="#25171c" stroke="#f85149" stroke-width="1.5"/>
<text x="304.0" y="254" text-anchor="middle" font-size="15.5" font-weight="700" fill="#f85149">BLOCKED</text>
<text x="304.0" y="278" text-anchor="middle" font-size="12.5" fill="#8b949e">the reasons and suggestions</text>
<text x="304.0" y="295" text-anchor="middle" font-size="12.5" fill="#8b949e">go back to Hermes, which revises</text>
<path d="M304.0 151 L304.0 217" fill="none" stroke="#f85149" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M171 268.0 L88.0 268.0 L88.0 151" fill="none" stroke="#f85149" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="5 4"/>
<rect x="648" y="222" width="392" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="844.0" y="254" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e6edf3">A changed move, speed or spec</text>
<text x="844.0" y="278" text-anchor="middle" font-size="12.5" fill="#8b949e">has no approval: the hook refuses it</text>
<text x="844.0" y="295" text-anchor="middle" font-size="12.5" fill="#8b949e">until a new check passes</text>
<path d="M736.0 217 L736.0 151" fill="none" stroke="#8b949e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-muted)" stroke-dasharray="5 4"/>
<text x="520" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#8b949e">Simulation-based risk screening, not a safety guarantee.</text>
</svg>
