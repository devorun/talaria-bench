# Calibration 3b of caduceus.yaml (8 Nov 2026), with Devran's measurements of the real robot:
# all four feet touch the floor when standing (a card fits under none of them), the leg joints
# have a deliberate large free play that ends against the head, the electronics sit on top of the
# head, and the firmware walk (2 cycles) moves the robot ~6 cm forward. Firmware speed comes from
# code analysis (PCA9685 I2C time per smoothMove step), not from the videos (some are sped up).
# Every range below is a plausible physical range, not a fit.
description: Caduceus wave and walk (3b, with real measurements).
spec: caduceus.yaml
samples: 400
seed: 2028
bins: 4

parameters:
  leg_gap_cm: [-0.2, 0.0]          # measured: all four feet touch; foam crushes 0-2 mm
  arm_above_pivot_cm: [1.5, 4.0]   # arm pivot height: how much of the 23.5 cm arm sits above its pivot
  head_mass_g: [250, 400]
  head_com_z_cm: [2, 4]            # electronics on top: head centre of mass 2-4 cm above its box centre
  arm_mass_g: [15, 40]
  leg_mass_g: [15, 40]
  arm_depth_cm: [4, 6]             # x size (front-back) of the arms
  leg_depth_cm: [4, 6]
  arm_backlash_deg: [1, 2.5]       # MG90S gear play, arms (small)
  leg_play_deg: [3, 10]            # deliberate free play of the leg joints, ends against the head
  foam_timeconst: [0.01, 0.05]     # foam contact softness: MuJoCo solref time constant (s)
  foam_width_mm: [1, 8]            # foam contact: depth over which it stiffens (solimp width)
  friction: [0.3, 0.7]             # lacquered wood
  fr_left_arm: [0.6, 1.4]          # per-foot friction factor: hand-wrapped aluminium tape
  fr_right_arm: [0.6, 1.4]
  fr_left_leg: [0.6, 1.4]
  fr_right_leg: [0.6, 1.4]
  step_overhead_ms: [3.0, 4.5]     # I2C time per smoothMove step (4 channels x ~0.75-1.1 ms at 100 kHz)
  tether_n: [0, 0.15]              # pull of the 2-3 m power cable
  tether_dir_deg: [90, 270]        # roughly backwards or sideways (180 = straight back)
  tether_at_x: [-3, 0]             # where the cable plugs into the head (cm, head frame): back half
  tether_at_y: [-8, 8]
  tether_at_z: [0, 4.5]            # upper half (electronics on top)
  off_left_arm: [-3, 3]            # servo calibration offsets (deg) present from boot
  off_left_leg: [-3, 3]
  off_right_leg: [-3, 3]
  off_right_arm: [-3, 3]
  torque_scale: [0.8, 1.1]         # MG90S at 5 V, datasheet optimism / supply sag
  kp_scale: [0.6, 1.2]
  latency_s: [0, 0.04]
  floor_tilt_deg: [0, 1.5]
  floor_tilt_dir_deg: [-180, 180]

apply:
  parts.head.mass: head_mass_g
  parts.head.com.2: head_com_z_cm
  parts.left_arm.mass: arm_mass_g
  parts.right_arm.mass: arm_mass_g
  parts.left_leg.mass: leg_mass_g
  parts.right_leg.mass: leg_mass_g
  parts.left_arm.size.0: arm_depth_cm
  parts.right_arm.size.0: arm_depth_cm
  parts.left_leg.size.0: leg_depth_cm
  parts.right_leg.size.0: leg_depth_cm
  # Arm pivot stays at the same place on the head; the arm slides along its length.
  parts.left_arm.joint.offset.2: arm_above_pivot_cm - 11.75
  parts.right_arm.joint.offset.2: arm_above_pivot_cm - 11.75
  # Leg bottom = anchor - 16; arm bottom = 1.0 - (23.5 - above) => anchor = gap - 6.5 + above
  parts.left_leg.joint.anchor.2: leg_gap_cm - 6.5 + arm_above_pivot_cm
  parts.right_leg.joint.anchor.2: leg_gap_cm - 6.5 + arm_above_pivot_cm
  parts.left_arm.joint.servo.backlash_deg: arm_backlash_deg
  parts.right_arm.joint.servo.backlash_deg: arm_backlash_deg
  parts.left_leg.joint.servo.backlash_deg: leg_play_deg
  parts.right_leg.joint.servo.backlash_deg: leg_play_deg
  materials.foam.solref.0: foam_timeconst
  materials.foam.solimp.2: foam_width_mm / 1000
  tether.max_force_n: tether_n
  tether.at.0: tether_at_x
  tether.at.1: tether_at_y
  tether.at.2: tether_at_z
  parts.left_arm.friction: fr_left_arm
  parts.right_arm.friction: fr_right_arm
  parts.left_leg.friction: fr_left_leg
  parts.right_leg.friction: fr_right_leg

world:
  friction: friction
  tether_scale: 1
  tether_dir_deg: tether_dir_deg
  offsets_deg.left_arm: off_left_arm
  offsets_deg.left_leg: off_left_leg
  offsets_deg.right_leg: off_right_leg
  offsets_deg.right_arm: off_right_arm
  torque_scale: torque_scale
  kp_scale: kp_scale
  latency_s: latency_s
  floor_tilt_deg: floor_tilt_deg
  floor_tilt_dir_deg: floor_tilt_dir_deg

targets:
  wave:
    description: WhatsApp and hello-hermes clips - the right arm swings up, the body stays level, no tip.
    move: wave
    speed: (1 + 3.95) / (1 + step_overhead_ms)   # spec timing assumes 3.95 ms overhead; smoothMove wait 1 ms
    require:
      fell: false
      max_roll_change_deg: {max: 5}          # side-to-side: clearly visible in the front-view clips
      max_pitch_change_deg: {max: 10}        # front-back: barely visible from the front (cos 10 deg = 0.985)
      yaw_deg: {abs_max: 5}                  # the robot keeps facing the camera
      rise_cm.right_arm: {min: 2.0}          # the waving arm visibly leaves the floor
  walk:
    description: Firmware walk n=2 ("come") - ~6 cm forward measured by Devran; yaw only reported.
    move: walk
    speed: (3 + 3.95) / (3 + step_overhead_ms)   # smoothMove wait 3 ms
    require:
      fell: false
      forward_cm: {min: 3, max: 9}
