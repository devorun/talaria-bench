name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    env:
      MUJOCO_GL: disable
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (the plugin.yaml ranges; fastapi + httpx for the dashboard API tests)
        run: python -m pip install "mujoco>=3.1.6,<5" "numpy>=1.26,<3" "pyyaml>=6.0,<7" pytest fastapi httpx
      - name: Tests (slow simulation runs excluded)
        run: python -m pytest -q -m "not slow"

  slow-and-spawn:
    name: slow tests + spawn worker pools (ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: disable
      TALARIA_MP_START: spawn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "mujoco>=3.1.6,<5" "numpy>=1.26,<3" "pyyaml>=6.0,<7" pytest fastapi httpx
      - name: Full suite with the spawn start method
        run: python -m pytest -q
