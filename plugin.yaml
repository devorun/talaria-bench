name: talaria-bench
version: 1.0.0
manifest_version: 2
description: >-
  A physics test bench for DIY servo robots. Describe your robot (parts, sizes, masses, hobby servos)
  and test it in MuJoCo across many randomized worlds; every move gets a simulated preflight (tip chance
  with a 95% interval, servo load estimates) before it may play on the real robot. No GPU, no CAD.
author: Devran (devorun)
homepage: https://github.com/devorun/talaria-bench
license: MIT
requires_hermes: ">=0.22.0"
tags: [robotics, simulation, mujoco, servo, hardware]
python_dependencies:
  - mujoco>=3.1.6,<5
  - numpy>=1.26,<3
  - pyyaml>=6.0,<7
provides_tools:
  - robot_list
  - robot_define
  - robot_show
  - bench_run
  - bench_status
  - bench_report
  - bench_compare
  - move_check
  - move_save
  - move_list
  - robot_play
  - robot_pose
  - robot_stop
  - robot_status
provides_hooks:
  - pre_tool_call
config_schema:
  robot_url:
    type: str
    default: ""
    label: Robot address
    description: "Where the real robot (Talaria firmware) answers, e.g. http://192.168.1.8. Used only for target 'real'."
  robot_token:
    type: secret
    env: TALARIA_ROBOT_TOKEN
    label: Robot token
    description: "Shared token: the ROBOT_TOKEN that `hermes talaria firmware` writes into robot_config.h. Required for target 'real' unless allow_unauthenticated_robot is on."
  real_robot:
    type: str
    default: caduceus
    label: Robot at that address
    description: "Which robot spec the real robot is (its firmware must report the same name)."
  timeout_s:
    type: float
    default: 3.0
    label: Request timeout (seconds)
  check_worlds:
    type: int
    default: 60
    label: Preflight worlds
    description: "Randomized worlds per full move_check (60 to 500; a quick check starts with 30 and extends a clean run to 60)."
  allow_unauthenticated_robot:
    type: bool
    default: false
    label: Allow a real robot without a token
    description: "Off (default): moves are refused on a real robot when no robot token is set, because anything on the network could then move it."
  allow_firmware_mismatch:
    type: bool
    default: false
    label: Allow firmware from another spec version
    description: "Off (default): moves are refused on a real robot whose firmware reports a different spec hash than the checked robot spec, or none."
